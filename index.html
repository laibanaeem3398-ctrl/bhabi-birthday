<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Bhabi ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #a18cd1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: white;
        }

        /* START SCREEN */
        #startScreen {
            text-align: center;
        }

        #startScreen h1 {
            font-size: clamp(30px, 7vw, 55px);
            margin-bottom: 25px;
        }

        #startScreen button,
        .buttons button,
        #nextWishBtn {
            border: none;
            padding: 14px 25px;
            border-radius: 30px;
            background: white;
            color: #e91e63;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
        }

         #startScreen {

            position: fixed;

            inset: 0;

            width: 100%;

            min-height: 100vh;

            padding: 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    #ffd6e7,
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #c471ed
                );

            z-index: 9999;
        }


        #startScreen h1 {

            width: 100%;

            max-width: 800px;

            font-size:
                clamp(
                    28px,
                    7vw,
                    60px
                );

            line-height: 1.2;

            margin-bottom: 20px;

            text-shadow:
                0 0 10px white,
                0 0 20px #ff1493,
                0 0 35px #ff1493;

            animation:
                startGlow 2s infinite alternate;
        }


        #startScreen p {

            width: 100%;

            max-width: 600px;

            font-size:
                clamp(
                    15px,
                    3vw,
                    22px
                );

            line-height: 1.7;

            margin-bottom: 30px;
        }


        #startScreen button {

            border: none;

            padding:
                15px 28px;

            min-height: 50px;

            border-radius: 50px;

            background: white;

            color: #d81b60;

            font-size:
                clamp(
                    15px,
                    2.5vw,
                    19px
                );

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.25);

            transition:
                transform 0.3s,
                background 0.3s;

            animation:
                buttonPulse 1.5s infinite;
        }


        #startScreen button:hover {

            transform: scale(1.08);

            background: #ffe6f0;
        }


        @keyframes startGlow {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.04);
            }
        }


        @keyframes buttonPulse {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }


        /* BIRTHDAY PAGE */
        #birthdayPage {
            display: none;
            width: 100%;
            padding: 20px;
        }

        .card {
            width: min(95%, 600px);
            margin: auto;
            padding: 30px 20px;
            text-align: center;

            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: clamp(32px, 7vw, 55px);
        }

        h2 {
            margin: 10px 0 20px;
            font-size: clamp(22px, 5vw, 35px);
        }

        .photo {
            width: clamp(150px, 45vw, 220px);
            height: clamp(150px, 45vw, 220px);
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            margin: 15px auto;
            display: block;
        }

       
        .date {

            display: inline-block;

            max-width: 100%;

            padding:
                9px 20px;

            margin:
                8px 0 15px;

            background:
                rgba(255,255,255,0.25);

            border-radius: 30px;

            font-size:
                clamp(
                    15px,
                    3.5vw,
                    22px
                );

            font-weight: bold;

            line-height: 1.4;
        }


        .cake {
            font-size: 60px;
            margin: 15px;
        }

        .buttons {
            margin: 25px 0;
        }

        /* WISH BOX */
        #wish {
            display: none;
            margin-top: 25px;
            padding: 25px 15px;

            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        #wishText {
            font-size: clamp(18px, 4vw, 25px);
            line-height: 1.7;
            font-weight: bold;
            animation: wishChange 0.6s ease;
        }

        #nextWishBtn {
            margin-top: 25px;
        }

        @keyframes wishChange {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* HEARTS */
        .heart {
            position: fixed;
            pointer-events: none;
            font-size: 25px;
        }

        /* MOBILE */
        @media (max-width: 500px) {

            #birthdayPage {
                padding: 10px;
            }

            .card {
                padding: 25px 15px;
            }

            .cake {
                font-size: 50px;
            }

            #wish {
                padding: 20px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- START SCREEN -->
 
    <div id="startScreen">

        <h1>
            🎁 A Special Surprise 🎁
        </h1>


        <p>

            💕 For My Lovely Bhabi 💕

            <br>

            Click below to open your birthday surprise!

        </p>


        <button onclick="openBirthday()">

            💖 Open Birthday Card 💖

        </button>

    </div>


    <!-- BIRTHDAY PAGE -->
    <div id="birthdayPage">

        <div class="card">

            <h1>🎉 Happy Birthday 🎉</h1>

            <h2>My Lovely Bhabi ❤️</h2>

            <img
                class="photo"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkCAd2XABwU_VKT82LDxsm_dI0hGVAyH74TlqGWCRF6U7p6KshmH4I8DA&s=10"
                alt="Bhabi">

            <div class="date">

                🎉 6 October 🎉

            </div>

            <div class="cake">
                🎂
            </div>


            <!-- BUTTON -->
            <div class="buttons">

                <button onclick="showWish()">
                    💌 Open Special Wish
                </button>

            </div>


            <!-- WISHES -->
            <!-- Ye starting mein hidden hai -->

            <div id="wish">

                <div id="wishText"></div>

                <button id="nextWishBtn" onclick="showWish()">
                    💌 Next Wish
                </button>

            </div>

        </div>

    </div>


    <!-- MUSIC -->
    <audio id="birthdaySong" loop>

        <source src="music.mp3" type="audio/mpeg">

    </audio>


    <script>

        // =========================
        // OPEN BIRTHDAY
        // =========================

        function openBirthday() {

            document.getElementById("startScreen").style.display = "none";

            document.getElementById("birthdayPage").style.display = "block";

            const song = document.getElementById("birthdaySong");

            song.play().catch(function () {
                console.log("Music could not play.");
            });

        }


        // =========================
        // WISHES
        // =========================

        const wishes = [

            `🌹 Dear Bhabi 🌹
            <br><br>
            🎂 Happy Birthday to you! 🎂
            <br>
            May your day be filled with happiness and love ❤️`,

            `💖 My Lovely Bhabi 💖
            <br><br>
            May Allah always keep you happy,
            healthy and successful. 🤲✨`,

            `🌸 Happy Birthday Bhabi 🌸
            <br><br>
            Aap ki har dua qabool ho,
            aur aap ki zindagi khushiyon se bhar jaye. ❤️`,

            `🎁 Special Birthday Wish 🎁
            <br><br>
            May every new day bring
            lots of beautiful moments for you. 🌷`,

            `👑 Best Bhabi 👑
            <br><br>
            You are not just a Bhabi,
            you are a beautiful part of our family. ❤️`,

            `🌹 Lots of Love 🌹
            <br><br>
            Allah aapko hamesha
            muskurata hua rakhe. 🤲💖`,

            `🎂 Once Again Happy Birthday 🎂
            <br><br>
            Enjoy your special day
            with lots of smiles and happiness! 🥰`,

            `💝 Final Wish 💝
            <br><br>
            Happy Birthday My Lovely Bhabi!
            <br>
            Stay Blessed Always! ❤️✨`
        ];


        let wishIndex = 0;


        // =========================
        // SHOW WISH ON BUTTON CLICK
        // =========================

        function showWish() {

            const wish = document.getElementById("wish");

            const wishText = document.getElementById("wishText");


            // Wish box show
            wish.style.display = "block";


            // Current wish show
            wishText.innerHTML = wishes[wishIndex];


            // Animation restart
            wishText.style.animation = "none";

            wishText.offsetHeight;

            wishText.style.animation = "wishChange 0.6s ease";


            // Next wish
            wishIndex++;


            // Last wish ke baad dobara first
            if (wishIndex >= wishes.length) {

                wishIndex = 0;

            }


            // Hearts
            createHearts();

        }


        // =========================
        // HEART ANIMATION
        // =========================

        function createHearts() {

            for (let i = 0; i < 25; i++) {

                const heart = document.createElement("div");

                heart.className = "heart";

                heart.innerHTML = "❤️";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.top =
                    Math.random() * 100 + "vh";


                document.body.appendChild(heart);


                heart.animate(

                    [
                        {
                            transform: "translateY(0) scale(1)",
                            opacity: 1
                        },

                        {
                            transform: "translateY(-200px) scale(1.5)",
                            opacity: 0
                        }
                    ],

                    {
                        duration: 2000,
                        easing: "ease-out"
                    }

                );


                setTimeout(function () {

                    heart.remove();

                }, 2000);

            }

        }

    </script>

</body>
</html>
